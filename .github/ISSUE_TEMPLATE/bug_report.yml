name: Bug report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include relevant diagnostics when you can. Logs can help diagnose webhook or
        integration bugs, but may contain private activity or secrets. Review and trim
        them before posting. Report sensitive security issues privately using
        [SECURITY.md](https://github.com/dannyvfilms/Floppy/blob/latest/SECURITY.md).
  - type: checkboxes
    id: logs-attached
    attributes:
      label: Logs
      description: |
        Instance administrators can use **Settings > Advanced > Download Sanitized Logs**.
        Known credential patterns are redacted; private titles, account details, URLs, or
        unrecognized secrets can remain. Share only a reviewed, relevant excerpt. If you
        cannot access logs, describe the problem without them. If Floppy will not start,
        you can run the startup check and review its output before sharing:

        ```bash
        # The container runs, but it is unhealthy or idle.
        docker exec floppy python manage.py floppy_preflight --json

        # The container restarts or has exited.
        docker compose run --rm floppy python manage.py floppy_preflight --json
        ```
      options:
        - label: I reviewed any diagnostics I am sharing for private data and secrets
          required: true
  - type: textarea
    id: log-output
    attributes:
      label: Log file / startup check output
      description: Share a reviewed excerpt or startup check output, if useful. Diagnostics are optional.
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
  - type: input
    id: version
    attributes:
      label: Floppy version
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (default)
        - PostgreSQL
    validations:
      required: true
