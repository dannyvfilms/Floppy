name: Bug report
description: Report something in Floppy that isn't working as expected.
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report sensitive security issues privately using
        [SECURITY.md](https://github.com/dannyvfilms/Floppy/blob/latest/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What went wrong?
      description: Describe what happened and what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Tell us what you were doing when the problem occurred. If you're unsure how to reproduce it, describe what you remember.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where did this happen?
      options:
        - Web browser
        - iOS app
        - Android app
        - Integration or background activity
        - Server or installation
        - Multiple platforms
        - Other / Not Sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Floppy version
      description: Your installed version can be found at the bottom of Settings > About. Enter "Not sure" if you cannot access it.
      placeholder: e.g. v26.11.19
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options:
        - SQLite (default)
        - PostgreSQL
        - Not Sure
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots & additional context
      description: Include screenshots, screen recordings or any other details that might help us understand the problem.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs & diagnostics
      description: |
        Logs are strongly encouraged for all bug reports and help us investigate and resolve issues more efficiently.

        Instance administrators can download logs from Settings > Advanced > Download Sanitized Logs.

        Review your logs for private information and secrets before sharing them, even if they have been sanitized.

        If Floppy will not start, follow the [startup diagnostics instructions](https://github.com/dannyvfilms/Floppy/blob/latest/docs/deployment.md#startup-diagnostics) and share the output.

        If you cannot provide logs, please explain why below.
      placeholder: Attach your reviewed log file, paste relevant diagnostic output, or explain why logs are unavailable.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Diagnostics privacy acknowledgment
      options:
        - label: I've reviewed any diagnostics I'm sharing for private information and secrets.
          required: true
