name: App Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_call:
    inputs:
      release_quality_gates:
        description: "Use non-browser tests for Docker publication; PR checks still include Playwright."
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  # On a push to latest that is a pull request merge, the pull request's own
  # App Tests run may already have executed on a commit with exactly this tree.
  # This job decides whether that is so. The rules and the reasoning are in
  # scripts/reuse_pr_tests.py and docs/architecture/test-suite-cost.md.
  #
  # The job runs on every event and reports "not applicable" for anything but
  # a publish-gate push to latest. It is deliberately never skipped: a skipped
  # job makes GitHub skip every later job in the chain that has no explicit
  # status check, so a job added after the shards could vanish. The output below
  # can only be "reuse" for a publish-gate push to latest, whatever the script
  # printed, so pull request, tag, release and manual runs always get the
  # shards. A failure here is not a failure of the gate; it means "run".
  #
  # Without the REUSE_PR_TEST_RESULTS repository variable set to "true" the
  # script only reports what it would have decided.
  # Rollback: delete that variable.
  reuse_decision:
    name: Reuse PR test result?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    # Read-only, and no secret other than this token reaches the script.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      decision: >-
        ${{ (inputs.release_quality_gates && github.event_name == 'push' &&
        github.ref == 'refs/heads/latest' &&
        steps.decide.outputs.decision == 'reuse') && 'reuse' || 'run' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compare the pushed tree with the tree the pull request tested
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_PR_TEST_RESULTS: ${{ vars.REUSE_PR_TEST_RESULTS }}
        run: python3 scripts/reuse_pr_tests.py

  # Builds the migrated SQLite test database once and hands it to the test
  # jobs, so each of them restores it instead of replaying every migration
  # (src/config/test_db_template.py, docs/architecture/test-suite-cost.md).
  #
  # The cache key is the runner's own key: a hash of every migration file, the
  # lockfile, settings, the runner and the Python and SQLite versions. A changed
  # input is a new key, and a new key is a real replay here. On a cache hit the
  # database is restored and Django still runs migrate on it; that must apply
  # nothing or the step fails.
  #
  # This job never decides whether the gate passes. If it fails, the test jobs
  # find no saved database and replay migrations themselves, as they always
  # did. It runs even when the shards reuse a pull request's result, so the
  # cache on latest stays warm for the next pull request.
  # Rollback: set the TEST_DB_TEMPLATE repository variable to "false".
  test_db_template:
    name: Migrated test database
    if: vars.TEST_DB_TEMPLATE != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
      FLOPPY_TEST_DB_TEMPLATE: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras

      - name: Compute the database key
        id: key
        run: |
          set -euo pipefail
          key="$(uv run --no-sync python src/config/test_db_template.py | tail -n 1)"
          [[ "$key" =~ ^[0-9a-f]{32}$ ]]
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Look for a saved database
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .floppy/testdb-*.sqlite3
          key: testdb-${{ runner.os }}-${{ steps.key.outputs.key }}

      # The module holds one database-backed test, so this run replays the
      # migrations and saves the result, or restores the saved file and proves
      # migrate has nothing to apply. The "[test-db]" line says which.
      - name: Build or restore the database
        run: scripts/test.sh config.tests.test_test_db_template --timing

      - name: Hand the database to the test jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-db-template
          path: .floppy/testdb-${{ steps.key.outputs.key }}-*.sqlite3
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  test_shards:
    name: test (${{ matrix.suite }}, ${{ matrix.python-version }})
    needs: [reuse_decision, test_db_template]
    # Skipped only when the decision job succeeded and said "reuse". A decision
    # job that failed, timed out or wrote nothing runs the shards. So does a
    # database job that failed or was switched off: the shards then replay.
    if: >-
      ${{ !cancelled() && !(needs.reuse_decision.result == 'success' &&
      needs.reuse_decision.outputs.decision == 'reuse') }}
    # A single non-app shard grew past the 105-minute watchdog on a slow
    # hosted runner. Keep each shard near half the old workload; the timeout
    # still leaves setup margin beyond the test budget.
    #
    # No job here runs under coverage. Tracing one context per test made
    # every shard slower, and nothing it produces decides whether an
    # image is safe. Coverage and the affected-test map come from
    # coverage.yml, which runs beside the publish gate, not in front of it.
    # Its shard list must match this one.
    timeout-minutes: 120
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
      FLOPPY_TEST_TIMEOUT: "6600"
      FLOPPY_TEST_WATCHDOG: "6300"
      FLOPPY_TEST_PARALLEL: "1"
      FLOPPY_TEST_DB_TEMPLATE: ${{ vars.TEST_DB_TEMPLATE != 'false' && '1' || '0' }}
      TEST_APPS: ${{ matrix.apps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Separate serial processes avoid the documented multiprocessing
        # worker/result failures. Every app belongs to exactly one shard.
        # Integrations is nearly as large as the remaining non-app apps and
        # has the slowest provider suites, so it gets its own runner.
        include:
          - python-version: "3.12"
            suite: app
            apps: app
          - python-version: "3.12"
            suite: integrations
            apps: integrations
          - python-version: "3.12"
            suite: other
            apps: users lists events api config
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          uv run --no-sync playwright install --with-deps chromium

      - name: Fetch migration baseline
        run: git fetch --no-tags https://github.com/FuzzyGrim/Yamtrack.git dev:refs/remotes/upstream/dev

      # Missing or unusable is not an error: the runner replays migrations and
      # says so in its "[test-db]" line.
      - name: Fetch the migrated test database
        id: test_db
        if: vars.TEST_DB_TEMPLATE != 'false'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-db-template
          path: .floppy

      - name: Note a missing test database
        if: vars.TEST_DB_TEMPLATE != 'false' && steps.test_db.outcome != 'success'
        run: echo "::warning::No saved test database for this run; replaying migrations."

      - name: MCP tests
        if: matrix.suite == 'app'
        run: uv run --no-sync python -m pytest -c mcp_server/pyproject.toml mcp_server/tests -q --durations=20

      - name: Script tests
        if: matrix.suite == 'app'
        run: uv run --no-sync python -m unittest discover -s scripts/tests --durations 20

      - name: Run Tests
        env:
          RELEASE_QUALITY_GATES: ${{ inputs.release_quality_gates }}
        run: |
          read -r -a apps <<< "$TEST_APPS"
          # A clean required PR baseline still covers every non-browser
          # test, plus browser coverage in the app and integrations shards.
          # The other shard's existing provider/list Playwright regressions
          # run in the visible, non-blocking browser_regressions job below.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ matrix.suite }}" = "other" ]; then
              scripts/test.sh "${apps[@]}" --exclude-tag playwright --timing --durations 30
            elif [ "${{ matrix.suite }}" = "app" ]; then
              # The one intermittent short-viewport alphabet browser case
              # remains visible in browser_regressions below. All other app
              # Playwright tests are still required.
              scripts/test.sh "${apps[@]}" --exclude-tag flaky_alphabet_rail --timing --durations 30
            else
              scripts/test.sh "${apps[@]}" --timing --durations 30
            fi
          else
            # scripts/test.sh adds --parallel --buffer and --exclude-tag
            # network, and wraps the run in the FLOPPY_TEST_TIMEOUT kill and
            # the FLOPPY_TEST_WATCHDOG stack dump. The set of tests is the one
            # this path ran under coverage before.
            test_args=()
            if [ "$RELEASE_QUALITY_GATES" = "true" ]; then
              # Keep the full browser contract on pull requests, where it can
              # block the change responsible. Do not stall image publication
              # because pre-existing web/React Playwright cases fail on latest.
              test_args+=(--exclude-tag playwright)
              echo "::notice::Docker release gate excludes Playwright; pull requests still run the complete suite."
            fi
            scripts/test.sh "${apps[@]}" "${test_args[@]}" --timing --durations 30
          fi

  # Temporary diagnostic quarantine for historical provider settings and
  # list interaction browser failures. Keep these tests running on every PR,
  # with visible failure logs, without blocking unaffected backend and app
  # changes. Remove this job and restore blocking other-shard Playwright once
  # its regressions are fixed. This must never be treated as E2E-green.
  browser_regressions:
    name: Browser E2E (other, diagnostic)
    needs: test_db_template
    # The status check keeps this job running when the database job failed or
    # was switched off; it then replays migrations itself.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
      FLOPPY_TEST_TIMEOUT: "6600"
      FLOPPY_TEST_WATCHDOG: "6300"
      FLOPPY_TEST_PARALLEL: "1"
      FLOPPY_TEST_DB_TEMPLATE: ${{ vars.TEST_DB_TEMPLATE != 'false' && '1' || '0' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies and Chromium
        run: |
          uv sync --locked --all-packages --all-extras
          uv run --no-sync playwright install --with-deps chromium
      # Missing or unusable is not an error: the runner replays migrations and
      # says so in its "[test-db]" line.
      - name: Fetch the migrated test database
        id: test_db
        if: vars.TEST_DB_TEMPLATE != 'false'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-db-template
          path: .floppy
      - name: Note a missing test database
        if: vars.TEST_DB_TEMPLATE != 'false' && steps.test_db.outcome != 'success'
        run: echo "::warning::No saved test database for this run; replaying migrations."
      - name: Exercise quarantined browser regressions
        run: |
          echo "::notice::Other-shard browser E2E remains diagnostic, not passing or skipped."
          # Preserve the full other-shard browser contract plus the single
          # flaky alphabet browser acceptance test on every pull request.
          scripts/test.sh users lists events api config \
            app.tests.test_alphabet_filter_browser.AlphabetBrowserTests.test_alphabet_navigation_fallback_themes_and_lifecycle \
            --tag playwright --timing --durations 30

  oauth_postgres:
    name: OAuth (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run OAuth, reliable sync and custom field tests on PostgreSQL
        run: >-
          scripts/test_postgres.sh integrations.tests.test_oauth_device_flow
          api.tests.test_reliable_sync api.tests.test_reliable_sync_postgres
          app.tests.test_reliable_sync_migration
          app.tests.views.test_collection_custom_field_list

  # These two checks read more than the tree: hygiene compares against the
  # upstream baseline fetched at run time. They run on every commit, in their
  # own job, so they still run on the pushed commit when the shards are reused.
  migration_checks:
    name: Migration checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET: ci-tests-only-not-a-production-secret
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --all-packages --all-extras
      - name: Fetch migration baseline
        run: git fetch --no-tags https://github.com/FuzzyGrim/Yamtrack.git dev:refs/remotes/upstream/dev
      - name: Migration hygiene
        run: uv run --no-sync python src/manage.py check_migration_hygiene --strict
      - name: Check for missing migrations
        run: uv run --no-sync python src/manage.py makemigrations --check --dry-run

  # Preserve the existing required-check name while requiring every shard,
  # the migration checks and OAuth.
  test:
    name: test (3.12)
    needs: [reuse_decision, test_shards, migration_checks, oauth_postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - env:
          DECISION_RESULT: ${{ needs.reuse_decision.result }}
          DECISION: ${{ needs.reuse_decision.outputs.decision }}
          SHARD_RESULT: ${{ needs.test_shards.result }}
          MIGRATION_RESULT: ${{ needs.migration_checks.result }}
          OAUTH_RESULT: ${{ needs.oauth_postgres.result }}
        run: |
          set -eu
          test "$MIGRATION_RESULT" = success
          test "$OAUTH_RESULT" = success
          if [ "$SHARD_RESULT" = success ]; then
            exit 0
          fi
          # The only other passing state: the decision job itself succeeded,
          # said "reuse", and the shards were skipped for that reason. A shard
          # that failed, was cancelled, or was skipped for any other reason
          # fails this check.
          test "$DECISION_RESULT" = success
          test "$DECISION" = reuse
          test "$SHARD_RESULT" = skipped
          echo "::notice::Test shards reused from the pull request run; see the 'Reuse PR test result?' job summary."

  release_lint:
    name: release lint
    # Keep this check separate from the required PR lint job.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/lint.yml

  upgrade:
    name: Upgrade (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Replay representative release with retained user data
        # A pinned release is intentional: the tag being published must not
        # accidentally become its own upgrade baseline. Advance deliberately.
        run: scripts/replay_upgrade_matrix.sh --from-tag v26.9.24 --to-ref HEAD --db "${{ matrix.database }}" --with-drift-scenarios
