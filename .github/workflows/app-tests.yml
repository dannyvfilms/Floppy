name: App Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  test_shards:
    name: test (${{ matrix.suite }}, ${{ matrix.python-version }})
    # Hosted full-suite execution has exceeded 68 minutes (run 38993407779).
    # Leave setup/coverage time beyond the runner's bounded 110-minute budget.
    timeout-minutes: 120
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
      FLOPPY_TEST_TIMEOUT: "6600"
      FLOPPY_TEST_WATCHDOG: "6300"
      FLOPPY_TEST_PARALLEL: "1"
      TEST_APPS: ${{ matrix.apps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        # Separate serial processes avoid the documented multiprocessing
        # worker/result failures. Every app belongs to exactly one shard.
        include:
          - python-version: "3.12"
            suite: app
            apps: app
          - python-version: "3.12"
            suite: other
            apps: users integrations lists events api config
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          uv run --no-sync playwright install --with-deps chromium

      - name: Fetch migration baseline
        run: git fetch --no-tags https://github.com/FuzzyGrim/Yamtrack.git dev:refs/remotes/upstream/dev

      - name: Migration hygiene
        if: matrix.suite == 'app'
        run: uv run --no-sync python src/manage.py check_migration_hygiene --strict

      - name: Check for missing migrations
        if: matrix.suite == 'app'
        run: uv run --no-sync python src/manage.py makemigrations --check --dry-run

      - name: MCP tests
        if: matrix.suite == 'app'
        run: uv run --no-sync python -m pytest -c mcp_server/pyproject.toml mcp_server/tests -q --durations=20

      - name: Script tests
        if: matrix.suite == 'app'
        run: uv run --no-sync python -m unittest discover -s scripts/tests --durations 20

      - name: Run Tests
        env:
          COVERAGE_CORE: ctrace
        run: |
          read -r -a apps <<< "$TEST_APPS"
          # Cross-app signals, dynamic imports and new branches cannot be
          # safely selected from a previous run's line coverage. Every PR
          # runs the offline suite, including historical browser regressions.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            scripts/test.sh "${apps[@]}" --timing --durations 30
          else
            timeout --kill-after=30s "$FLOPPY_TEST_TIMEOUT" \
              uv run --no-sync coverage run src/manage.py test \
              "${apps[@]}" \
              --parallel --buffer --exclude-tag network --timing --durations 30
          fi

      - name: Upload shard coverage
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-${{ matrix.suite }}
          path: .coverage.*
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  oauth_postgres:
    name: OAuth (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run OAuth and reliable sync tests on PostgreSQL
        run: >-
          scripts/test_postgres.sh integrations.tests.test_oauth_device_flow
          api.tests.test_reliable_sync api.tests.test_reliable_sync_postgres
          app.tests.test_reliable_sync_migration

  # Preserve the existing required-check name while requiring both shards and OAuth.
  test:
    name: test (3.12)
    needs: [test_shards, oauth_postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$SHARD_RESULT" = success && test "$OAUTH_RESULT" = success
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
          OAUTH_RESULT: ${{ needs.oauth_postgres.result }}

  coverage:
    needs: test_shards
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install coverage dependencies
        run: uv sync --locked --only-group test
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: coverage-*
          merge-multiple: true

      - name: Build Coverage Report
        run: |
          uv run --no-sync coverage combine
          mkdir -p .floppy
          cp .coverage .floppy/affected.coverage
          uv run --no-sync coverage report
          uv run --no-sync coverage xml

      - name: Upload affected map
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: affected-map
          path: .floppy/affected.coverage
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/lint.yml

  upgrade:
    name: Upgrade (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Replay representative release with retained user data
        # A pinned release is intentional: the tag being published must not
        # accidentally become its own upgrade baseline. Advance deliberately.
        run: scripts/replay_upgrade_matrix.sh --from-tag v26.9.24 --to-ref HEAD --db "${{ matrix.database }}" --with-drift-scenarios
