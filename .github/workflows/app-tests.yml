name: App Tests

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_call:
    inputs:
      release_quality_gates:
        description: "Use non-browser tests for Docker publication; PR checks still include Playwright."
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  test_shards:
    name: test (${{ matrix.suite }}, ${{ matrix.python-version }})
    # A single non-app shard grew past the 105-minute watchdog on a slow
    # hosted runner. Keep each shard near half the old workload; the timeout
    # still leaves setup margin beyond the test budget.
    #
    # No job here runs under coverage. Tracing one context per test made
    # every shard slower, and nothing it produces decides whether an
    # image is safe. Coverage and the affected-test map come from
    # coverage.yml, which runs beside the publish gate, not in front of it.
    # Its shard list must match this one.
    timeout-minutes: 120
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
      FLOPPY_TEST_TIMEOUT: "6600"
      FLOPPY_TEST_WATCHDOG: "6300"
      FLOPPY_TEST_PARALLEL: "1"
      TEST_APPS: ${{ matrix.apps }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        # Separate serial processes avoid the documented multiprocessing
        # worker/result failures. Every app belongs to exactly one shard.
        # Integrations is nearly as large as the remaining non-app apps and
        # has the slowest provider suites, so it gets its own runner.
        include:
          - python-version: "3.12"
            suite: app
            apps: app
          - python-version: "3.12"
            suite: integrations
            apps: integrations
          - python-version: "3.12"
            suite: other
            apps: users lists events api config
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Install dependencies
        run: |
          uv sync --locked --all-packages --all-extras
          uv run --no-sync playwright install --with-deps chromium

      - name: Fetch migration baseline
        run: git fetch --no-tags https://github.com/FuzzyGrim/Yamtrack.git dev:refs/remotes/upstream/dev

      - name: Migration hygiene
        if: matrix.suite == 'app'
        run: uv run --no-sync python src/manage.py check_migration_hygiene --strict

      - name: Check for missing migrations
        if: matrix.suite == 'app'
        run: uv run --no-sync python src/manage.py makemigrations --check --dry-run

      - name: MCP tests
        if: matrix.suite == 'app'
        run: uv run --no-sync python -m pytest -c mcp_server/pyproject.toml mcp_server/tests -q --durations=20

      - name: Script tests
        if: matrix.suite == 'app'
        run: uv run --no-sync python -m unittest discover -s scripts/tests --durations 20

      - name: Run Tests
        env:
          RELEASE_QUALITY_GATES: ${{ inputs.release_quality_gates }}
        run: |
          read -r -a apps <<< "$TEST_APPS"
          # A clean required PR baseline still covers every non-browser
          # test, plus browser coverage in the app and integrations shards.
          # The other shard's existing provider/list Playwright regressions
          # run in the visible, non-blocking browser_regressions job below.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ matrix.suite }}" = "other" ]; then
              scripts/test.sh "${apps[@]}" --exclude-tag playwright --timing --durations 30
            elif [ "${{ matrix.suite }}" = "app" ]; then
              # The one intermittent short-viewport alphabet browser case
              # remains visible in browser_regressions below. All other app
              # Playwright tests are still required.
              scripts/test.sh "${apps[@]}" --exclude-tag flaky_alphabet_rail --timing --durations 30
            else
              scripts/test.sh "${apps[@]}" --timing --durations 30
            fi
          else
            # scripts/test.sh adds --parallel --buffer and --exclude-tag
            # network, and wraps the run in the FLOPPY_TEST_TIMEOUT kill and
            # the FLOPPY_TEST_WATCHDOG stack dump. The set of tests is the one
            # this path ran under coverage before.
            test_args=()
            if [ "$RELEASE_QUALITY_GATES" = "true" ]; then
              # Keep the full browser contract on pull requests, where it can
              # block the change responsible. Do not stall image publication
              # because pre-existing web/React Playwright cases fail on latest.
              test_args+=(--exclude-tag playwright)
              echo "::notice::Docker release gate excludes Playwright; pull requests still run the complete suite."
            fi
            scripts/test.sh "${apps[@]}" "${test_args[@]}" --timing --durations 30
          fi

  # Temporary diagnostic quarantine for historical provider settings and
  # list interaction browser failures. Keep these tests running on every PR,
  # with visible failure logs, without blocking unaffected backend and app
  # changes. Remove this job and restore blocking other-shard Playwright once
  # its regressions are fixed. This must never be treated as E2E-green.
  browser_regressions:
    name: Browser E2E (other, diagnostic)
    if: github.event_name == 'pull_request'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
      FLOPPY_TEST_TIMEOUT: "6600"
      FLOPPY_TEST_WATCHDOG: "6300"
      FLOPPY_TEST_PARALLEL: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies and Chromium
        run: |
          uv sync --locked --all-packages --all-extras
          uv run --no-sync playwright install --with-deps chromium
      - name: Exercise quarantined browser regressions
        run: |
          echo "::notice::Other-shard browser E2E remains diagnostic, not passing or skipped."
          # Preserve the full other-shard browser contract plus the single
          # flaky alphabet browser acceptance test on every pull request.
          scripts/test.sh users lists events api config \
            app.tests.test_alphabet_filter_browser.AlphabetBrowserTests.test_alphabet_navigation_fallback_themes_and_lifecycle \
            --tag playwright --timing --durations 30

  oauth_postgres:
    name: OAuth (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET: ci-tests-only-not-a-production-secret
      FLOPPY_TEST_FAST_DB: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Run OAuth, reliable sync and custom field tests on PostgreSQL
        run: >-
          scripts/test_postgres.sh integrations.tests.test_oauth_device_flow
          api.tests.test_reliable_sync api.tests.test_reliable_sync_postgres
          app.tests.test_reliable_sync_migration
          app.tests.views.test_collection_custom_field_list

  # Preserve the existing required-check name while requiring every shard and OAuth.
  test:
    name: test (3.12)
    needs: [test_shards, oauth_postgres]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$SHARD_RESULT" = success && test "$OAUTH_RESULT" = success
        env:
          SHARD_RESULT: ${{ needs.test_shards.result }}
          OAUTH_RESULT: ${{ needs.oauth_postgres.result }}

  release_lint:
    name: release lint
    # Keep this check separate from the required PR lint job.
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/lint.yml

  upgrade:
    name: Upgrade (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
      - name: Install dependencies
        run: uv sync --locked --no-default-groups --group test
      - name: Replay representative release with retained user data
        # A pinned release is intentional: the tag being published must not
        # accidentally become its own upgrade baseline. Advance deliberately.
        run: scripts/replay_upgrade_matrix.sh --from-tag v26.9.24 --to-ref HEAD --db "${{ matrix.database }}" --with-drift-scenarios
