name: Lint

on:
  pull_request:
  push:
    branches: [latest]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Check dependency lock
        run: uv lock --check

      - name: Install lint dependencies
        run: uv sync --locked --only-group lint

      - name: Ruff
        run: uv run --no-sync ruff check src mcp_server

      - name: Dependency vulnerabilities
        run: scripts/audit_dependencies.sh

      - name: Install locked frontend dependencies
        run: npm ci --ignore-scripts

      - name: Verify committed UI bundles
        run: npm run check:ui

      - name: Verify UI architecture and validator regressions
        env:
          UI_ARCH_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          npm run check:ui-architecture
          npm run test:ui-architecture
          npm run test:ui-render

      - name: Install isolated Expo proof dependencies
        working-directory: native-proof
        run: npm ci --ignore-scripts

      - name: Export Expo platform bundles
        working-directory: native-proof
        env:
          CI: "1"
        run: npm run export -- --platform all

      - name: Audit Expo proof dependencies
        working-directory: native-proof
        run: npm audit --ignore-scripts --audit-level=high

      - name: Audit frontend build dependencies
        run: npm audit --ignore-scripts
