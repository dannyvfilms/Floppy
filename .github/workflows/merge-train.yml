name: Merge Train

# latest requires pull requests to be up to date before they merge, and GitHub's
# merge queue is not available on a personal repository, so auto-merge alone
# stalls once the first PR lands. This keeps the next approved PR (one with
# auto-merge on) up to date, one at a time, so auto-merge can finish it. See
# scripts/merge_train.py for the rules. Run it by hand with "dry run" ticked to
# see what it would do without touching anything.
#
# It runs when latest moves, when a pull request is approved (auto-merge
# switched on or off), marked ready, pushed to or closed, and when a CI run
# finishes, so the queue advances as soon as anything changes. The 15 minute
# schedule is only a safety net: GitHub delays and drops scheduled runs (about
# 5 of 96 ran on 2026-10-19). Pull request and CI events from forks run this
# workflow as it is on latest, never the fork's copy, and nothing from the pull
# request is checked out or run: the script only reads the GitHub API.
#
# A run is red when the queue has pull requests but none could advance. The job
# summary lists what was decided for each one and why.
#
# Needs the AUTO_MERGE_TOKEN secret (Pull requests and Contents read/write): a
# branch updated with the built-in token does not start CI.
# Maintainer edit permission on a fork does not guarantee this token can update
# its branch. On a GitHub refusal, the contributor has to merge latest manually.

on:
  push:
    branches:
      - latest
  pull_request_target:
    branches:
      - latest
    types:
      - auto_merge_enabled
      - auto_merge_disabled
      - ready_for_review
      - converted_to_draft
      - synchronize
      - reopened
      - closed
  workflow_run:
    workflows:
      - App Tests
      - Lint
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would happen"
        type: boolean
        default: true

concurrency:
  group: merge-train
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  merge-train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Update the next pull request in line
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTO_MERGE_TOKEN secret is not set."
            exit 1
          fi
          python3 scripts/merge_train.py $([ "$DRY_RUN" = "true" ] && echo --dry-run)
