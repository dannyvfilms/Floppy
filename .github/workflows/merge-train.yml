name: Merge Train

# latest requires pull requests to be up to date before they merge, and GitHub's
# merge queue is not available on a personal repository, so auto-merge alone
# stalls once the first PR lands. This keeps approved PRs (auto-merge on) up to
# date by merging latest into their branches, so their own CI reruns and GitHub's
# auto-merge lands whichever goes green first. Up to MERGE_TRAIN_DEPTH (repository
# variable, default 3) migration-free PRs are refreshed at once; PRs that change
# migrations are refreshed one at a time in approval order. It never creates
# branches or PRs and never merges anything itself. See scripts/merge_train.py
# for the rules. Run it by hand with "dry run" ticked to see what it would do
# without touching anything.
#
# It runs when latest moves, or a pull request's auto-merge, readiness, head,
# or closed state changes, and when a required-check workflow finishes on a PR
# (a failure frees a slot; a success can change the order). Events for
# unrelated or obsolete heads are ignored by the script.
# The 15 minute schedule is only a safety net: GitHub delays and drops scheduled runs (about
# 5 of 96 ran on 2026-10-19). Pull request and CI events from forks run this
# workflow as it is on latest, never the fork's copy, and nothing from the pull
# request is checked out or run: the script only reads the GitHub API.
#
# A run is red when the queue has pull requests but none could advance. The job
# summary lists what was decided for each one and why.
#
# UI bundles: with the repository variable MERGE_TRAIN_REBUILD_UI set to "true", an
# owner-authored same-repository PR whose branch and latest both changed the UI
# build inputs (or conflict) is not refreshed through the API. The planner
# above only lists it; ui-build merges the exact head and latest SHAs and rebuilds
# src/static/ui/ in a read-only job with no secrets; ui-publish treats that output as
# untrusted data, re-checks everything, and pushes one merge commit. See
# scripts/merge_train_ui.py. Unset the variable to roll back.
#
# Needs the AUTO_MERGE_TOKEN secret (Pull requests and Contents read/write): a
# branch updated with the built-in token does not start CI.
# Maintainer edit permission on a fork does not guarantee this token can update
# its branch. On a GitHub refusal, the contributor has to merge latest manually.

on:
  push:
    branches:
      - latest
  pull_request_target:
    branches:
      - latest
    types:
      - opened
      - edited
      - auto_merge_enabled
      - auto_merge_disabled
      - ready_for_review
      - converted_to_draft
      - synchronize
      - reopened
      - closed
  workflow_run:
    workflows: ["App Tests", "Lint", "Migration Order"]
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would happen"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  merge-train:
    # Bursts of check completions collapse into one pending run per group.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'pull_request'
    concurrency:
      group: merge-train
      cancel-in-progress: false
    runs-on: ubuntu-latest
    outputs:
      ui_refresh: ${{ steps.refresh.outputs.ui_refresh || '[]' }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: latest
          persist-credentials: false

      - name: Refresh approved pull requests
        id: refresh
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          CI_HEAD: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          MERGE_TRAIN_DEPTH: ${{ vars.MERGE_TRAIN_DEPTH || '3' }}
          MERGE_TRAIN_REBUILD_UI: ${{ vars.MERGE_TRAIN_REBUILD_UI }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::AUTO_MERGE_TOKEN secret is not set."
            exit 1
          fi
          python3 scripts/merge_train.py $([ "$DRY_RUN" = "true" ] && echo --dry-run)

  # Builds PR code, so it has a read-only token, no secrets and no credentials
  # on disk. Its output is untrusted data for ui-publish.
  ui-build:
    needs: merge-train
    if: needs.merge-train.outputs.ui_refresh != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.merge-train.outputs.ui_refresh) }}
    steps:
      - name: Trusted scripts from latest
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: latest
          path: trusted
          persist-credentials: false

      - name: Pull request branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ matrix.entry.head }}
          path: work
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Merge latest and rebuild the UI bundles
        env:
          NUMBER: ${{ matrix.entry.number }}
          HEAD_SHA: ${{ matrix.entry.head }}
          BASE_SHA: ${{ matrix.entry.base }}
        run: |
          python3 trusted/scripts/merge_train_ui.py build --work work --out out \
            --number "$NUMBER" --head "$HEAD_SHA" --base "$BASE_SHA"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-${{ matrix.entry.number }}
          path: out
          if-no-files-found: ignore
          retention-days: 1

  # Has the token. Runs only the script from latest; never runs artifact content.
  ui-publish:
    needs: [merge-train, ui-build]
    if: always() && needs.merge-train.outputs.ui_refresh != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: latest
          persist-credentials: false

      - name: Download build results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts

      - name: Publish refreshed branches
        env:
          GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PLAN: ${{ needs.merge-train.outputs.ui_refresh }}
        run: python3 scripts/merge_train_ui.py publish --artifacts artifacts
