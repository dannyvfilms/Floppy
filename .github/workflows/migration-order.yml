name: Migration Order

# Stops two pull requests from adding clashing migrations (the same number, or
# two leaf nodes). Each one passes CI on its own, so both used to auto-merge and
# break latest. A pull request that touches a migration now has to contain every
# migration already on latest. Pull requests without migrations always pass.
#
# The same job then merges latest into the branch and loads Django's migration
# graph, so two migrations that merge without a text conflict (different file
# names, same parent) still fail here with a clear message instead of only
# after the full test run. Merging latest is not a fix for that: the migration
# the pull request adds must be pointed at the new latest migration.
#
# Needs "migration-order" added to the required status checks of the ruleset on
# latest. It runs on every pull request, with no path filter, so a docs or
# workflow-only pull request still gets the (passing) result.
#
# When a migration lands on latest, the second job re-runs the check on every
# open pull request, so one that was green before is held back until it has
# merged latest again.

on:
  pull_request:
  push:
    branches:
      - latest
    paths:
      - "src/*/migrations/**"

permissions:
  contents: read

jobs:
  migration-order:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Check migrations against the base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # Only latest has this problem; release PRs are not checked.
          if [ "$BASE_REF" != "latest" ]; then
            echo "Base branch is $BASE_REF; nothing to order."
            exit 0
          fi
          # Fetch latest now rather than trusting the checkout, because this job
          # can be re-run after latest has moved.
          git fetch --no-tags origin latest
          python3 scripts/check_migration_order.py HEAD origin/latest

      - name: Find out whether the pull request changes migrations
        id: migrations
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          changed=false
          if [ "$BASE_REF" = "latest" ] && [ -n "$(git diff --name-only \
              "$(git merge-base HEAD origin/latest)" HEAD -- 'src/*/migrations/*.py')" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Merge latest into the branch
        if: steps.migrations.outputs.changed == 'true'
        run: |
          git config user.name "migration-order"
          git config user.email "migration-order@users.noreply.github.com"
          if ! git merge --no-edit origin/latest; then
            echo "::error::This branch conflicts with latest. Resolve the conflict first."
            exit 1
          fi

      - name: Set up Python
        if: steps.migrations.outputs.changed == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Set up uv
        if: steps.migrations.outputs.changed == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"

      - name: Check the migration graph with latest merged in
        if: steps.migrations.outputs.changed == 'true'
        env:
          SECRET: ci-migration-graph-only-not-a-production-secret
        run: |
          uv sync --locked
          uv run --no-sync python src/manage.py check_migration_hygiene --no-strict

  recheck-open-pull-requests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Re-run the check on open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --base latest --state open --json number,headRefOid \
            --jq '.[] | "\(.number) \(.headRefOid)"' |
          while read -r number sha; do
            run_id=$(gh run list --workflow migration-order.yml --event pull_request \
              --commit "$sha" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -z "$run_id" ]; then
              echo "#$number: no run for $sha"
              continue
            fi
            echo "#$number: re-running $run_id"
            gh run rerun "$run_id" || echo "#$number: could not re-run (still running?)"
          done
