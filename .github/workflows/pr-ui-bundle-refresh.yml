name: Refresh PR UI Bundles (temporary)
on:
  push:
    branches: [codex/fix-release-quality-gates-20261108]
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - run: npm ci --ignore-scripts
      - run: npm run build:ui && npm run check:ui
      - name: Commit refreshed bundles to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/static/ui
          if ! git diff --cached --quiet; then
            git commit -m "Refresh generated UI bundles for browser fixes"
            git push origin HEAD:refs/heads/codex/fix-release-quality-gates-20261108
          fi
