name: Update Sponsors goal card

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

# SPONSORS_GOAL_TOKEN (or SPONSORS_TOKEN) is a personal access token from dannyvfilms. The built-in
# workflow token cannot read Sponsors data ("Resource not accessible by
# integration"), and PRs it opens do not start CI, so the token does both jobs.
permissions:
  contents: read

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: latest
          token: ${{ secrets.SPONSORS_GOAL_TOKEN || secrets.SPONSORS_TOKEN }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Fetch GitHub Sponsors goal and render card
        env:
          GITHUB_TOKEN: ${{ secrets.SPONSORS_GOAL_TOKEN || secrets.SPONSORS_TOKEN }}
        run: python scripts/update_sponsors_goal.py
      - name: Open a PR with the updated card
        env:
          GH_TOKEN: ${{ secrets.SPONSORS_GOAL_TOKEN || secrets.SPONSORS_TOKEN }}
        run: |
          echo "Base: latest at $(git rev-parse --short HEAD)"
          echo "Card on latest: $(grep -o '[0-9]*% of \$[0-9,]* per month' docs/brand/sponsors-goal.svg | head -1)"
          if git diff --quiet -- docs/brand/sponsors-goal.svg; then
            echo "Sponsors goal card is already current"
            echo "Card is already current: $(grep -o '[0-9]*% of \$[0-9,]* per month' docs/brand/sponsors-goal.svg | head -1)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          new=$(grep -o '[0-9]*% of \$[0-9,]* per month' docs/brand/sponsors-goal.svg | head -1)
          old=$(git show HEAD:docs/brand/sponsors-goal.svg | grep -o '[0-9]*% of \$[0-9,]* per month' | head -1)
          echo "Card change: $old -> $new"
          echo "Card change: $old -> $new" >> "$GITHUB_STEP_SUMMARY"
          echo "Open card PRs: $(gh pr list --head automation/sponsors-goal-card --state open --json number,createdAt --jq 'map("#\(.number) opened \(.createdAt)")|join(", ")')"
          branch=automation/sponsors-goal-card
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git checkout -B "$branch"
          git add docs/brand/sponsors-goal.svg
          git commit -m "Update GitHub Sponsors goal card"
          git push --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base latest --head "$branch" \
              --title "Update GitHub Sponsors goal card" \
              --body "Daily refresh of the README Sponsors goal card."
          fi
          # Keep the PR description current so it says what this run changed and when.
          body=$(printf 'Daily refresh of the README Sponsors goal card.\n\nChange: %s -> %s\nGenerated: %s\nRun: %s/%s/actions/runs/%s' "$old" "$new" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
          gh pr edit "$branch" --body "$body" || true
          # The README shows whatever is on latest, so an unmerged card PR leaves the old
          # figure up. Merge it once checks pass.
          gh pr merge "$branch" --auto --squash || echo "Auto-merge unavailable; merge the card PR by hand"
