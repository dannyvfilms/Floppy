name: Update Sponsors goal card

on:
  push:
    paths:
      - ".github/workflows/update-sponsors-goal.yml"
      - "docs/brand/sponsors-goal.svg"
      - "scripts/update_sponsors_goal.py"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Fetch GitHub Sponsors goal and render card
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_sponsors_goal.py
      - name: Commit updated card
        run: |
          if git diff --quiet -- docs/brand/sponsors-goal.svg; then
            echo "Sponsors goal card is already current"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/brand/sponsors-goal.svg
          git commit -m "Update GitHub Sponsors goal card"
          git push
