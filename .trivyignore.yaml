# Reviewed container-scan exceptions (issue #1625). Each entry needs an id,
# a statement of why it does not apply, and an expiry.
vulnerabilities:
  - id: CVE-2026-118669
    statement: >-
      oauthlib 3.3.1 is installed only as a client library (django-allauth and
      apprise via requests-oauthlib). Floppy never runs oauthlib's server-side
      token grant handlers, which is the affected code. The fix is oauthlib 4.0.0,
      which django-allauth 65.15.0 forbids (oauthlib>=3.3.0,<4); upgrade when
      allauth allows it.
    expired_at: 2026-12-02
  - id: CVE-2026-49272
    statement: >-
      Same package and reason as CVE-2026-118669: client-only use of oauthlib 3.3.1,
      fixed in 4.0.0, which django-allauth 65.15.0 does not yet allow.
    expired_at: 2026-12-02
