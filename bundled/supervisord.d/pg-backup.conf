; Daily logical backup of the embedded database, plus the signing secret.
; FLOPPY_BUNDLED_BACKUP_KEEP=0 disables it.
[program:pg-backup]
command=sh -c 'sleep 600; while :; do floppy-bundled-backup || echo "[bundled] scheduled backup failed" >&2; sleep 86400; done'
user=abc
priority=30
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
