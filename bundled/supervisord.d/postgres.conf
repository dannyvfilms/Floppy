; Embedded PostgreSQL (Floppy Bundled). Priority 0 starts first and, because
; supervisord stops in reverse order, stops last, after the app has exited.
; SIGINT is PostgreSQL's "fast shutdown".
[program:postgres]
command=postgres -D %(ENV_FLOPPY_BUNDLED_PGDATA)s -c listen_addresses= -c unix_socket_directories=%(ENV_FLOPPY_BUNDLED_PGSOCKET)s -c unix_socket_permissions=0700 -c shared_buffers=64MB -c max_connections=60
user=abc
priority=0
startsecs=3
stopsignal=INT
stopwaitsecs=90
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
