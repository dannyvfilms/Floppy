; Embedded Valkey (cache + Celery broker), loopback only.
[program:valkey]
command=valkey-server --bind 127.0.0.1 --port 6379 --dir %(ENV_FLOPPY_BUNDLED_VALKEY_DIR)s --save "300 1" --protected-mode yes
user=abc
priority=0
startsecs=2
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
