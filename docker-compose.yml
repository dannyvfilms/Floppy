services:
  yamtrack:
    container_name: yamtrack
    # Image defaults to :latest tag (latest commit on the latest branch)
    # Use :release or :vX.X.X for stable builds tied to a GitHub Release
    # Use :dev for the development branch
    image: ghcr.io/dannyvfilms/yamtrack:latest
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - TZ=Europe/Berlin
      - SECRET=longstring
      - REDIS_URL=redis://redis:6379
      - ADMIN_ENABLED=False
      # Keep DEBUG off in production: the debug toolbar slows every request
      # and disables Django's cached template loader.
      - DEBUG=False
      # Web server concurrency: WEB_CONCURRENCY gunicorn worker processes,
      # each serving GUNICORN_THREADS requests concurrently. The defaults
      # (2 workers x 4 threads) prevent one slow request from blocking the UI.
      - WEB_CONCURRENCY=2
      - GUNICORN_THREADS=4
    volumes:
      - ./db:/yamtrack/db
    ports:
      - "8000:8000"
    networks:
      - yamtrack-net

  redis:
    container_name: yamtrack-redis
    image: redis:8-alpine
    restart: unless-stopped
    # Persist to disk so a restart doesn't drop the cache wholesale (#386).
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - yamtrack-net

volumes:
  redis_data:


networks:
  yamtrack-net:
    driver: bridge
