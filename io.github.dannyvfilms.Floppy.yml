app-id: io.github.dannyvfilms.Floppy
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: floppy-desktop
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --device=dri
  - --persist=.var/app/io.github.dannyvfilms.Floppy/data

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/floppy-desktop/cargo
    RUSTUP_HOME: /usr/lib/sdk/rust-stable

modules:
  # 1. Redis Server
  - name: redis
    buildsystem: simple
    build-commands:
      - make -j $FLATPAK_BUILDER_N_JOBS
      - make install PREFIX=/app
    sources:
      - type: archive
        url: https://download.redis.io/releases/redis-7.4.0.tar.gz
        sha256: 57b47c2c6682636d697dbf5d66d8d495b4e653afc9cd32b7adf9da3e433b8aaf

  # 2. Python Dependencies (Generated by flatpak-pip-generator)
  - python-deps.json

  # 3. Floppy Backend (Django Source)
  - name: floppy-backend
    buildsystem: simple
    build-commands:
      - mkdir -p /app/share/floppy
      - cp -r * /app/share/floppy/
    sources:
      - type: dir
        path: .

  # 4. Floppy Desktop (Tauri Rust App)
  - name: floppy-desktop
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - cargo build --release
      - install -Dm755 target/release/floppy-desktop /app/bin/floppy-desktop
    sources:
      - type: dir
        path: desktop
