[project]
name = "floppy-mcp"
version = "0.2.0"
description = "MCP server exposing the Floppy REST API to AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28.0,<2.0.0",
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "PyYAML>=6.0",
]

[project.scripts]
floppy-mcp = "floppy_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["floppy_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "PT", "PD", "D100", "D104", "RUF012", "PLR0913", "SLF001",
    "COM812", "TD002", "TD003", "TD004",
    "INP001",  # this package intentionally has no __init__.py in tests/
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "D101", "D102", "D103", "D107", "PLR2004", "PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
