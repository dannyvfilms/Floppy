user abc;
# Nginx is event-driven and fronts a local threaded Gunicorn worker. Matching
# host CPU count only duplicates idle workers inside this single container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Preserve a view's explicit policy (the YouTube player needs an origin),
    # while retaining same-origin everywhere else.
    map $upstream_http_referrer_policy $floppy_referrer_policy {
        default $upstream_http_referrer_policy;
        "" "same-origin";
    }

    # URLs (including path segments) and referrers can contain bearer tokens.
    # Keep request counts/status/timing context without recording those secrets.
    log_format floppy_safe '$remote_addr [$time_local] '
                           '"$request_method $server_protocol" '
                           '$status $body_bytes_sent';
    access_log /dev/stdout floppy_safe;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 512M;
    client_body_buffer_size 256k;

    gzip on;
    # Level 5 shrinks the 80-170 KB HTML shell ~10% over the default 1 at
    # negligible CPU; tiny bodies are not worth compressing.
    gzip_comp_level 5;
    gzip_min_length 256;
    # Compress behind another proxy too, and tell caches the body varies.
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json text/calendar;

    upstream app_server {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy $floppy_referrer_policy always;

        # Proxy to Gunicorn
        location / {
            proxy_hide_header Referrer-Policy;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/ {
            access_log off;
            proxy_hide_header Referrer-Policy;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # The service worker is a public static file. Serving it here keeps the
        # browser's update check off Gunicorn, so it neither queues behind slow
        # requests nor fails with a 504 when every thread is busy. Headers match
        # app.views.service_worker; add_header in a location replaces the
        # server-level set, so the security headers are repeated.
        location = /serviceworker.js {
            alias /floppy/staticfiles/js/serviceworker.js;
            default_type application/javascript;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Pragma "no-cache" always;
            add_header Expires "0" always;
            add_header Service-Worker-Allowed "/" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
        }

        # Static files
        location /static/ {
            alias /floppy/staticfiles/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            # Skip the per-request stat/open of the ~60 assets a cold page pulls.
            open_file_cache max=2000 inactive=5m;
            open_file_cache_valid 1m;
            open_file_cache_errors off;
        }

    }
}
