user abc;
# Nginx is event-driven and fronts a local threaded Gunicorn worker. Matching
# host CPU count only duplicates idle workers inside this single container.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # URLs (including path segments) and referrers can contain bearer tokens.
    # Keep request counts/status/timing context without recording those secrets.
    log_format floppy_safe '$remote_addr [$time_local] '
                           '"$request_method $server_protocol" '
                           '$status $body_bytes_sent';
    access_log /dev/stdout floppy_safe;

    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    client_max_body_size 512M;
    client_body_buffer_size 256k;

    gzip on;
    # Compress behind another proxy too, and tell caches the body varies.
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/manifest+json text/calendar;

    upstream app_server {
        server 127.0.0.1:8001;
    }

    server {
        listen 8000;
        server_name _;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;

        # Proxy to Gunicorn
        location / {
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        location /health/ {
            access_log off;
            proxy_pass http://app_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Static files
        location /static/ {
            alias /floppy/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
        }

    }
}
