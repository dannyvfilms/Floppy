      operationId: searchMedia
      description: Search for media using the specified provider.
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 'Maximum number of results to return (default: 20).'
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - game
          - manga
          - movie
          - music
          - podcast
          - tv
        description: Media type. Does not include `season`/`episode` — those are addressed
          via separate path segments under `tv`.
        required: true
      - in: query
        name: offset
        schema:
          type: integer
        description: 'Offset for pagination (default: 0).'
      - in: query
        name: search
        schema:
          type: string
        description: Search query passed to the provider.
      - in: query
        name: source
        schema:
          type: string
        description: Provider to search (e.g. `tmdb`, `igdb`). Defaults to the media
          type's default provider when omitted.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchEnvelope'
              examples:
                GameSearchResult(igdb):
                  value:
                    pagination:
                      total: 1
                      limit: 20
                      offset: 0
                      next: null
                      previous: null
                    results:
                    - media_id: '2256'
                      source: igdb
                      media_type: game
                      title: Super Mario Strikers
                      image: https://images.igdb.com/igdb/image/upload/t_original/example.jpg
                      year: 2005
                      platforms:
                      - Nintendo GameCube
                  summary: Game search result (igdb)
                  description: Game results include `platforms` and `year` so a client
                    can pick the right release without a follow-up detail fetch. If
                    a title is ambiguous across platforms, all candidates are returned
                    rather than a single guess.
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
