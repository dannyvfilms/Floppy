      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - created_at
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  item_count:
                    type: integer
          description: ''
    delete:
      operationId: api_v1_tags_destroy
      description: Delete the tag and its item associations.
      parameters:
      - in: path
        name: tag_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/tasks/{task_id}/:
    get:
      operationId: api_v1_tasks_retrieve
      description: Return the current state of the task.
      parameters:
      - in: path
        name: task_id
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                - status
