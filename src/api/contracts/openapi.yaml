openapi: 3.0.3
info:
  title: Floppy verified MCP and grounding API
  version: 1.0.0
  description: Verified consumer subset covering MCP HTTP operations, public grounding
    information, and ListenBrainz-compatible authentication. The full diagnostic API
    schema remains available at /api/schema/.
  contact:
    url: https://github.com/dannyvfilms/Floppy/issues
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
paths:
  /api/v1/discover/:
    get:
      operationId: api_v1_discover_retrieve
      description: Return the cached Discover rows for the media type.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - media_type
                - show_more
                - rows
                properties:
                  media_type:
                    type: string
                  show_more:
                    type: boolean
                  rows:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/history/:
    get:
      operationId: api_v1_history_retrieve
      description: Return the user's history grouped by day, newest first.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - pagination
                - results
                properties:
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - next
                    - previous
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/home/:
    get:
      operationId: api_v1_home_retrieve
      description: Return home groups with serialized row items.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - groups
                properties:
                  groups:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
          description: ''
  /api/v1/imports/{service}/:
    post:
      operationId: api_v1_imports_create
      description: Dispatch the import task for the service.
      parameters:
      - in: path
        name: service
        schema:
          type: string
          pattern: ^[\w-]+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                type: object
                required:
                - task_id
                properties:
                  task_id:
                    type: string
          description: ''
  /api/v1/info/:
    get:
      operationId: getPublicInfo
      description: Get application information.
      tags:
      - api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfoResponse'
          description: ''
  /api/v1/lists/:
    get:
      operationId: api_v1_lists_retrieve
      description: Retrieve the lists for the authenticated user.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - pagination
                - results
                properties:
                  pagination:
                    type: object
                    required:
                    - total
                    - limit
                    - offset
                    - next
                    - previous
                    properties:
                      total:
                        type: integer
                      limit:
                        type: integer
                      offset:
                        type: integer
                      next:
                        type: string
                        nullable: true
                      previous:
                        type: string
                        nullable: true
                  results:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - name
                      - description
                      - image
                      - owner
                      - collaborators
                      - items_count
                      - latest_update
                      - is_public
                      - public_slug
                      - allow_recommendations
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        description:
                          type: string
                        image:
                          type: string
                          nullable: true
                        owner:
                          type: object
                          additionalProperties: true
                        collaborators:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
                        items_count:
                          type: integer
                        latest_update:
                          type: string
                          format: date-time
                          nullable: true
                        is_public:
                          type: boolean
                        public_slug:
                          type: string
                          nullable: true
                        allow_recommendations:
                          type: boolean
                        items:
                          oneOf:
                          - type: array
                            items:
                              type: object
                              additionalProperties: true
                          - type: object
                            required:
                            - pagination
                            - results
                            properties:
                              pagination:
                                type: object
                                required:
                                - total
                                - limit
                                - offset
                                - next
                                - previous
                                properties:
                                  total:
                                    type: integer
                                  limit:
                                    type: integer
                                  offset:
                                    type: integer
                                  next:
                                    type: string
                                    nullable: true
                                  previous:
                                    type: string
                                    nullable: true
                              results:
                                type: array
                                items:
                                  type: object
                                  additionalProperties: true
          description: ''
    post:
      operationId: api_v1_lists_create
      description: Create a new custom list for the authenticated user.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - image
                - owner
                - collaborators
                - items_count
                - latest_update
                - is_public
                - public_slug
                - allow_recommendations
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    additionalProperties: true
                  collaborators:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  items_count:
                    type: integer
                  latest_update:
                    type: string
                    format: date-time
                    nullable: true
                  is_public:
                    type: boolean
                  public_slug:
                    type: string
                    nullable: true
                  allow_recommendations:
                    type: boolean
                  items:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                    - type: object
                      required:
                      - pagination
                      - results
                      properties:
                        pagination:
                          type: object
                          required:
                          - total
                          - limit
                          - offset
                          - next
                          - previous
                          properties:
                            total:
                              type: integer
                            limit:
                              type: integer
                            offset:
                              type: integer
                            next:
                              type: string
                              nullable: true
                            previous:
                              type: string
                              nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
          description: ''
  /api/v1/lists/{list_id}/:
    patch:
      operationId: api_v1_lists_partial_update
      description: Update a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - name
                - description
                - image
                - owner
                - collaborators
                - items_count
                - latest_update
                - is_public
                - public_slug
                - allow_recommendations
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  image:
                    type: string
                    nullable: true
                  owner:
                    type: object
                    additionalProperties: true
                  collaborators:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  items_count:
                    type: integer
                  latest_update:
                    type: string
                    format: date-time
                    nullable: true
                  is_public:
                    type: boolean
                  public_slug:
                    type: string
                    nullable: true
                  allow_recommendations:
                    type: boolean
                  items:
                    oneOf:
                    - type: array
                      items:
                        type: object
                        additionalProperties: true
                    - type: object
                      required:
                      - pagination
                      - results
                      properties:
                        pagination:
                          type: object
                          required:
                          - total
                          - limit
                          - offset
                          - next
                          - previous
                          properties:
                            total:
                              type: integer
                            limit:
                              type: integer
                            offset:
                              type: integer
                            next:
                              type: string
                              nullable: true
                            previous:
                              type: string
                              nullable: true
                        results:
                          type: array
                          items:
                            type: object
                            additionalProperties: true
          description: ''
    delete:
      operationId: api_v1_lists_destroy
      description: Delete a specific custom list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/lists/{list_id}/items/:
    get:
      operationId: api_v1_lists_items_retrieve
      description: Get items of a list.
      parameters:
      - in: path
        name: list_id
        schema:
          type: string
          pattern: ^\d+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaEnvelope'
          description: ''
  /api/v1/media/:
    get:
      operationId: listTrackedMedia
      description: Retrieve the filtered media list for the authenticated user.
      parameters:
      - in: query
        name: author
        schema:
          type: string
      - in: query
        name: collection
        schema:
          type: string
          enum:
          - all
          - collected
          - not_collected
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: exclude
        schema:
          type: array
          items:
            type: string
        description: Root-list type exclusions; repeated and comma-separated syntax
          are accepted.
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: genre
        schema:
          type: string
      - in: query
        name: implied_genre
        schema:
          type: string
        description: Music-only implied genre filter.
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum 200; defaults to 20.
      - in: query
        name: media_status
        schema:
          type: string
        description: Provider metadata status, not the user's tracking status.
      - in: query
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Optional type restriction; omitted returns the default media
          types.
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset; defaults to 0.
      - in: query
        name: origin
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: array
          items:
            type: string
        description: Repeat for multiple platforms; comma-separated values are also
          accepted.
      - in: query
        name: platform_mode
        schema:
          type: string
          enum:
          - and
          - not
          - or
      - in: query
        name: progress
        schema:
          type: string
          enum:
          - all
          - caught_up
          - not_caught_up
        description: Currently meaningful for TV and anime lists.
      - in: query
        name: provider
        schema:
          type: string
      - in: query
        name: rating
        schema:
          type: string
          enum:
          - all
          - not_rated
          - rated
      - in: query
        name: release
        schema:
          type: string
          enum:
          - all
          - not_released
          - released
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - added
          - author
          - critic_rating
          - date_added
          - end_date
          - ended
          - id
          - itemid
          - mediaid
          - next_episode_air_date
          - platform
          - plays
          - popularity
          - progress
          - release_date
          - runtime
          - score
          - source
          - start_date
          - started
          - time_left
          - time_to_beat
          - time_watched
          - title
          - type
          - updated
        description: Legacy `field_asc`/`field_desc` suffixes remain accepted.
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Repeated status values. Accepts numeric codes 0=Planning, 1=In
          progress, 2=Paused, 3=Completed, 4=Dropped; labels; `all`; and `no_status`.
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: string
        description: Repeat for multiple tags; comma-separated values are also accepted.
      - in: query
        name: tag_exclude
        schema:
          type: string
        description: Legacy alias for `tag=<value>&tag_mode=not`.
      - in: query
        name: tag_mode
        schema:
          type: string
          enum:
          - and
          - not
          - or
      - in: query
        name: year
        schema:
          type: string
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaEnvelope'
          description: ''
  /api/v1/media/{media_type}/:
    get:
      operationId: listTrackedMediaByType
      description: Retrieve the filtered media list of a specific media type.
      parameters:
      - in: query
        name: author
        schema:
          type: string
      - in: query
        name: collection
        schema:
          type: string
          enum:
          - all
          - collected
          - not_collected
      - in: query
        name: country
        schema:
          type: string
      - in: query
        name: direction
        schema:
          type: string
          enum:
          - asc
          - desc
      - in: query
        name: format
        schema:
          type: string
      - in: query
        name: genre
        schema:
          type: string
      - in: query
        name: implied_genre
        schema:
          type: string
        description: Music-only implied genre filter.
      - in: query
        name: language
        schema:
          type: string
      - in: query
        name: limit
        schema:
          type: integer
        description: Maximum 200; defaults to 20.
      - in: query
        name: media_status
        schema:
          type: string
        description: Provider metadata status, not the user's tracking status.
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      - in: query
        name: offset
        schema:
          type: integer
        description: Zero-based result offset; defaults to 0.
      - in: query
        name: origin
        schema:
          type: string
      - in: query
        name: platform
        schema:
          type: array
          items:
            type: string
        description: Repeat for multiple platforms; comma-separated values are also
          accepted.
      - in: query
        name: platform_mode
        schema:
          type: string
          enum:
          - and
          - not
          - or
      - in: query
        name: progress
        schema:
          type: string
          enum:
          - all
          - caught_up
          - not_caught_up
        description: Currently meaningful for TV and anime lists.
      - in: query
        name: provider
        schema:
          type: string
      - in: query
        name: rating
        schema:
          type: string
          enum:
          - all
          - not_rated
          - rated
      - in: query
        name: release
        schema:
          type: string
          enum:
          - all
          - not_released
          - released
      - in: query
        name: search
        schema:
          type: string
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - added
          - author
          - critic_rating
          - date_added
          - end_date
          - ended
          - id
          - itemid
          - mediaid
          - next_episode_air_date
          - platform
          - plays
          - popularity
          - progress
          - release_date
          - runtime
          - score
          - source
          - start_date
          - started
          - time_left
          - time_to_beat
          - time_watched
          - title
          - type
          - updated
        description: Legacy `field_asc`/`field_desc` suffixes remain accepted.
      - in: query
        name: source
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: array
          items:
            type: string
        description: Repeated status values. Accepts numeric codes 0=Planning, 1=In
          progress, 2=Paused, 3=Completed, 4=Dropped; labels; `all`; and `no_status`.
      - in: query
        name: tag
        schema:
          type: array
          items:
            type: string
        description: Repeat for multiple tags; comma-separated values are also accepted.
      - in: query
        name: tag_exclude
        schema:
          type: string
        description: Legacy alias for `tag=<value>&tag_mode=not`.
      - in: query
        name: tag_mode
        schema:
          type: string
          enum:
          - and
          - not
          - or
      - in: query
        name: year
        schema:
          type: string
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaEnvelope'
          description: ''
    post:
      operationId: trackMedia
      description: |-
        Create a new consumption for a media item.

        This append-oriented endpoint keeps its historical default: omitted
        status means Planning. Clients updating an existing play should first
        read its consumption_id and use the exact history route instead.

        `progress` set here (and returned by every media/history endpoint) is
        always this one consumption's own value, never a sum across a user's
        other entries for the same item -- the response's `progress_scope`
        field is explicitly "entry" for this reason. Its unit varies by
        media_type (e.g. minutes for games, episodes for tv/season/anime,
        plays for boardgame/music) and is named in the response's
        `progress_unit` field.
      parameters:
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - episode
          - game
          - manga
          - movie
          - music
          - podcast
          - season
          - tv
        description: Media type, including `season` and `episode`. POST to a media-type
          collection creates a new consumption; omitted status defaults to Planning.
          Use the history/{consumption_id} route to update one specific existing consumption.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackMediaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TrackMediaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TrackMediaRequest'
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackedMediaResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
  /api/v1/media/{media_type}/{source}/{media_id}/:
    get:
      operationId: retrieveMediaItem
      description: Retrieve details of a specific media for the authenticated user.
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - game
          - manga
          - movie
          - music
          - podcast
          - tv
        description: Media type. Does not include `season`/`episode` — those are addressed
          via separate path segments under `tv`.
        required: true
      - in: path
        name: source
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompleteMediaResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
    patch:
      operationId: updateMediaItem
      description: |-
        Update the convenience/default tracked row for a media item.

        Use the history endpoint when the caller needs to target one exact
        consumption entry.
      parameters:
      - in: path
        name: media_id
        schema:
          type: string
          pattern: ^[^/]+$
        required: true
      - in: path
        name: media_type
        schema:
          type: string
          enum:
          - anime
          - boardgame
          - book
          - comic
          - comicissue
          - game
          - manga
          - movie
          - music
          - podcast
          - tv
        description: Media type. Does not include `season`/`episode` — those are addressed
          via separate path segments under `tv`.
        required: true
      - in: path
        name: source
        schema:
          type: string
