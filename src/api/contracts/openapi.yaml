                    type: string
                  task_name:
                    type: string
                    nullable: true
                  status:
                    type: string
                  date_created:
                    type: string
                    format: date-time
                    nullable: true
                  date_done:
                    type: string
                    format: date-time
                    nullable: true
                  result:
                    type: string
                    nullable: true
          description: ''
  /api/v1/user/preferences/:
    get:
      operationId: api_v1_user_preferences_retrieve
      description: Return the current preference values and valid choices.
      tags:
      - api
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - preferences
                - choices
                properties:
                  preferences:
                    type: object
                    additionalProperties: true
                  choices:
                    type: object
                    additionalProperties: true
          description: ''
    patch:
      operationId: api_v1_user_preferences_partial_update
      description: |-
        Update only the preference fields present in the request body.

        Omitted fields keep their stored value. Clients that change one
        preference, such as the header theme toggle, therefore do not need to
        echo the rest of the form back.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                required:
                - preferences
                - updated_fields
                properties:
                  preferences:
                    type: object
                    additionalProperties: true
                  updated_fields:
                    type: array
                    items:
                      type: string
          description: ''
  /apis/listenbrainz/1/submit-listens/:
    post:
      operationId: submitListenBrainzListens
      description: 'Accepts scrobbles from any ListenBrainz-compatible client. Authenticate
        with `Authorization: Token <your API token>`. `playing_now` submissions are
        accepted but not recorded.'
      summary: Submit listens (ListenBrainz-compatible)
      tags:
      - apis
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - listen_type
              - payload
              properties:
                listen_type:
                  type: string
                  enum:
                  - single
                  - import
                  - playing_now
                payload:
                  type: array
                  items:
                    type: object
      security:
      - listenBrainzToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenBrainzStatus'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenBrainzError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenBrainzError'
          description: ''
  /apis/listenbrainz/1/validate-token/:
    get:
      operationId: validateListenBrainzToken
      description: Reports whether the supplied token is valid. ListenBrainz clients
        call this on startup to confirm the connection.
      summary: Validate token (ListenBrainz-compatible)
      tags:
      - apis
      security:
      - listenBrainzToken: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListenBrainzToken'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailError'
          description: ''
