{# Selection state stays in Alpine (bulkSelection.js). The bar itself is the React BulkToolbar island; it reads window.__bulkSelection. #}
{{ bulk_action_data|json_script:"bulk-toolbar-props" }}
<div data-bulk-toolbar-root data-props-id="bulk-toolbar-props"
     x-effect="window.__bulkSelection = { active: selectMode, ids: [...selectedItemIds] }; window.dispatchEvent(new CustomEvent('bulk-selection-change'))"
     @bulk-actions-done.window="if (selectMode) { toggleSelectMode(); refresh(); }"
     @bulk-job-finished.window="refresh()"
     @bulk-selection-select-all.window="selectAll($event.detail.ids)"
     @bulk-actions-clear.window="clearSelection()"></div>
