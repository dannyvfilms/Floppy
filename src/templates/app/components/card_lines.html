{% for line in lines %}
  <p class="media-card-year text-xs text-[var(--color-text-muted)] mt-1 line-clamp-1{% if line.dormant %} media-card-line-dormant{% endif %}">{% for part in line.parts %}{% if not forloop.first %} · {% endif %}{% if part.score %}<span class="inline-flex items-center gap-0.5 text-yellow-300 align-middle">{% include "app/icons/star.svg" with classes="w-3 h-3 text-yellow-400 fill-current" %}<span class="font-medium">{{ part.text }}</span></span>{% else %}{{ part.text }}{% endif %}{% endfor %}</p>
{% endfor %}
