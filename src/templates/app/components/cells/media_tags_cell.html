{% load app_tags %}
{% with tag_names=media.item.item_tags.all|user_tag_names:user %}
  {% if tag_names %}
    <span class="block max-w-xs truncate" title="{{ tag_names|join:', ' }}">
      {{ tag_names|join:", " }}
    </span>
  {% else %}
    <span class="text-gray-500">-</span>
  {% endif %}
{% endwith %}
