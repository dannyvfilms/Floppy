{% load app_tags %}

{% for entry in collection_entries %}
  <div{% if forloop.last and collection_entries.has_next %} hx-get="{% url 'collection_list' %}?page={{ collection_entries.next_page_number }}" hx-trigger="revealed threshold:200px once" hx-swap="afterend" hx-include="#filter-form" hx-indicator="#collection-loading-indicator"{% endif %}>
    {% include "app/components/media_card.html" with item=entry.item title=entry.item media=None card_media_type=entry.item.media_type from_grid=True user=user show_release_year_placeholder=True %}
  </div>
{% endfor %}
