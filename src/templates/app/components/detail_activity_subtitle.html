{% load i18n %}
{% load app_tags %}
{% load user_tags %}

{% if activity_subtitle %}
  <div class="mb-3 text-center text-sm font-medium text-[var(--color-text-muted)] md:text-start">
    <button type="button" aria-haspopup="dialog" title="{% translate "View play history" %}"
            aria-label="{% translate "View play history" %}"
            class="flex w-full flex-wrap items-center justify-center md:justify-start group cursor-pointer hover:text-[var(--color-text)] hover:underline"
            hx-get="{% url 'activity_sessions_modal' %}?{% if media_type == MediaTypes.SEASON.value %}media_type={{ MediaTypes.TV.value }}&media_id={{ media.media_id|urlencode }}&source={{ media.source|urlencode }}&season_number={{ media.season_number }}{% elif media_type == MediaTypes.TV.value %}media_type={{ MediaTypes.TV.value }}&media_id={{ media.media_id|urlencode }}&source={{ media.source|urlencode }}{% elif media_type == MediaTypes.PODCAST.value and podcast_show %}media_type={{ MediaTypes.PODCAST.value }}&podcast_show={{ podcast_show.id }}{% else %}media_type={{ media_type }}&media_id={{ media.media_id|urlencode }}&source={{ media.source|urlencode }}{% endif %}{% if media_type == MediaTypes.GAME.value or media_type == MediaTypes.BOARDGAME.value %}&logging_style=sessions{% endif %}"
            hx-target="#session-history-modal-host"
            hx-swap="innerHTML"
            @click="$dispatch('open-session-history')">
      <span data-detail-activity-subtitle-root
            data-dates="{% if activity_subtitle.date_start %}{{ activity_subtitle.date_start|user_date_format:user }}{% if activity_subtitle.date_end and not activity_subtitle.collapse_same_day and activity_subtitle.date_start != activity_subtitle.date_end %} - {{ activity_subtitle.date_end|user_date_format:user }}{% endif %}{% elif activity_subtitle.date_end %}{{ activity_subtitle.date_end|user_date_format:user }}{% endif %}"
            data-duration="{% if activity_subtitle.duration_text %}{% if ' watched' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' watched' }} {% translate 'watched' %}{% elif ' played' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' played' }} {% translate 'played' %}{% elif ' listened' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' listened' }} {% translate 'listened' %}{% elif ' read' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' read' }} {% translate 'read' %}{% else %}{{ activity_subtitle.duration_text }}{% endif %}{% endif %}"
            data-primary="{{ activity_subtitle.primary_text|default:''|translate_activity_text:media_type }}">
        {% if activity_subtitle.date_start %}{{ activity_subtitle.date_start|user_date_format:user }}{% if activity_subtitle.date_end and not activity_subtitle.collapse_same_day and activity_subtitle.date_start != activity_subtitle.date_end %} - {{ activity_subtitle.date_end|user_date_format:user }}{% endif %}{% elif activity_subtitle.date_end %}{{ activity_subtitle.date_end|user_date_format:user }}{% endif %}{% if activity_subtitle.duration_text %}{% if activity_subtitle.date_start or activity_subtitle.date_end %}<span style="color: white"> • </span>{% endif %}{% if ' watched' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' watched' }} {% translate 'watched' %}{% elif ' played' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' played' }} {% translate 'played' %}{% elif ' listened' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' listened' }} {% translate 'listened' %}{% elif ' read' in activity_subtitle.duration_text %}{{ activity_subtitle.duration_text|cut:' read' }} {% translate 'read' %}{% else %}{{ activity_subtitle.duration_text }}{% endif %}{% elif not activity_subtitle.date_start and not activity_subtitle.date_end %}{{ activity_subtitle.primary_text|translate_activity_text:media_type }}{% endif %}
      </span>
    </button>
  </div>
{% endif %}
