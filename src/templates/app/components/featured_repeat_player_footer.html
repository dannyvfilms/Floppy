{% load app_tags %}
<div class="mt-4 flex flex-col gap-3 border-t border-white/10 pt-4 sm:flex-row sm:items-center sm:justify-between">
  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:flex-1 sm:min-w-0">
    <span class="text-sm text-[var(--color-text-muted)] shrink-0">Known For:</span>
    {% if featured_person and featured_person.known_for_pills %}
      <div class="flex flex-wrap gap-1.5 min-w-0">
        {% for pill in featured_person.known_for_pills %}
          <span class="text-xs px-2 py-1 rounded-md font-medium {{ pill.classes }}">{{ pill.label }}</span>
        {% endfor %}
      </div>
    {% else %}
      <span class="text-sm text-gray-500">No primary roles available.</span>
    {% endif %}
  </div>

  {% if featured_person %}
    <a href="{% url 'person_detail' source=featured_person.source person_id=featured_person.person_id name=featured_person.name|slug %}"
       class="inline-flex items-center gap-1 text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors shrink-0">
      View Profile
      <svg xmlns="http://www.w3.org/2000/svg"
           viewBox="0 0 20 20"
           fill="currentColor"
           class="w-4 h-4">
        <path fill-rule="evenodd" d="M3 10a.75.75 0 0 1 .75-.75h10.638L10.23 5.29a.75.75 0 1 1 1.04-1.08l5.5 5.25a.75.75 0 0 1 0 1.08l-5.5 5.25a.75.75 0 1 1-1.04-1.08l4.158-3.96H3.75A.75.75 0 0 1 3 10Z" clip-rule="evenodd"></path>
      </svg>
    </a>
  {% endif %}
</div>
