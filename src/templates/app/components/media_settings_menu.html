<div class="relative filter-control {{ menu_class|default:'' }}"
     x-data="{ open: false, sharing: false }"
     @click.outside="open = false">
  <button class="p-2 rounded-md border border-gray-700 bg-[var(--color-surface-strong)] hover:bg-[var(--color-surface-hover)] text-[var(--color-text-secondary)] transition-colors cursor-pointer"
          title="View settings"
          @click="open = !open"
          type="button">{% include "app/icons/settings.svg" with classes="w-5 h-5" %}</button>
  <div class="absolute right-0 z-40 mt-2 w-56 bg-[var(--color-surface-strong)] rounded-md shadow-lg overflow-hidden border border-gray-700"
       x-cloak
       x-show="open"
       x-transition:enter="transition ease-out duration-100"
       x-transition:enter-start="transform opacity-0 scale-95"
       x-transition:enter-end="transform opacity-100 scale-100"
       x-transition:leave="transition ease-in duration-75"
       x-transition:leave-start="transform opacity-100 scale-100"
       x-transition:leave-end="transform opacity-0 scale-95">
    <a :href="layoutHref(layout === 'grid' ? 'table' : 'grid')"
       class="flex items-center gap-2 w-full px-3 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
       @click="open = false">
      <span x-show="layout === 'grid'">{% include "app/icons/table.svg" with classes="w-4 h-4" %}</span>
      <span x-show="layout !== 'grid'">{% include "app/icons/four-square.svg" with classes="w-4 h-4" %}</span>
      <span x-text="layout === 'grid' ? 'Table View' : 'Grid View'"></span>
    </a>
    <button class="flex items-center gap-2 w-full px-3 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer disabled:opacity-50 disabled:cursor-wait"
            type="button"
            :disabled="sharing"
            @click="open = false; sharing = true; shareView().finally(() => { sharing = false; })">
      {% include "app/icons/link.svg" with classes="w-4 h-4" %}
      <span x-text="sharing ? 'Sharing…' : 'Share View'"></span>
    </button>
    <button class="flex items-center gap-2 w-full px-3 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-hover)] hover:text-[var(--color-text)] transition-colors cursor-pointer"
            type="button"
            @click="open = false; toggleSelectMode()">
      {% include "app/icons/tag.svg" with classes="w-4 h-4" %}
      <span x-text="selectMode ? 'Cancel Select' : 'Select Items'"></span>
    </button>
	<div class="flex items-center gap-2 w-full px-3 py-2 text-sm text-[var(--color-text-secondary)]">
		<form method="get" id="separate-plays-form" class="inline-form mr-2">
		  <input type="hidden" name="search" value="{{ request.GET.search|default:'' }}">
		  <input type="hidden" name="sort" value="{{ current_sort|default:'' }}">
		  <input type="hidden" name="direction" value="{{ current_direction|default:'' }}">
		  {% for s in current_status %}
			<input type="hidden" name="status" value="{{ s }}">
		  {% endfor %}

		  <!-- Ensure a value is always submitted: hidden input 0, checkbox overrides with 1 when checked -->
		  <input type="hidden" name="separate_plays" value="0" />
			<label class="toggle-wrapper">
			  <span class="toggle-label">Show all plays</span>

			  <input
				type="checkbox"
				name="separate_plays"
				value="1"
				{% if show_each_play %}checked{% endif %}
				onchange="this.form.querySelector('input[name=separate_plays][type=hidden]').disabled = this.checked; this.form.submit()"
				class="toggle-checkbox"
			  />

			  <span class="toggle-slider"></span>
			</label>

			<style>
			.toggle-wrapper {
			  display: inline-flex;
			  align-items: center;
			  gap: 8px;
			}

			.toggle-label {
			  font-size: 0.85rem;
			  color: var(--color-text-secondary);
			}

			.toggle-checkbox {
			  opacity: 0;
			  width: 0;
			  height: 0;
			}

			.toggle-slider {
			  position: relative;
			  width: 32px;   /* smaller width */
			  height: 16px;  /* smaller height */
			  background-color: #ccc;
			  border-radius: 16px;
			  cursor: pointer;
			  transition: background-color 0.2s;
			}

			.toggle-slider::before {
			  content: "";
			  position: absolute;
			  width: 12px;   /* smaller knob */
			  height: 12px;
			  left: 2px;
			  top: 2px;
			  background-color: white;
			  border-radius: 50%;
			  transition: transform 0.2s;
			}

			.toggle-checkbox:checked + .toggle-slider {
			  background-color: #4CAF50;
			}

			.toggle-checkbox:checked + .toggle-slider::before {
			  transform: translateX(16px); /* adjusted for smaller size */
			}
			</style>


		</form>
	</div>
  </div>
</div>
