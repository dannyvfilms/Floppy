{% load i18n %}

<div x-data="{ trackOpen: false }">
  <button type="button"
          class="p-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-full transition duration-300 cursor-pointer"
          title="{% translate 'Track notes' %}"
          aria-label="{% translate 'Track notes' %}"
          hx-get="{% url 'music_track_notes' track.id %}"
          hx-vals='{"return_url": "{{ request.get_full_path|escapejs }}"}'
          hx-target="#music-track-notes-editor-{{ track.id }}"
          @click="trackOpen = true">{% include "app/icons/edit.svg" with classes="w-4 h-4" %}</button>
  <template x-teleport="body">
    <div x-show="trackOpen"
         x-cloak
         @mousedown.self="trackOpen = false"
         @keydown.escape.window="trackOpen = false"
         class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
      <div class="w-full max-h-[90dvh] overflow-y-auto px-4"
           style="width: min(96vw, 42rem)">
        <div id="music-track-notes-editor-{{ track.id }}"></div>
      </div>
    </div>
  </template>
</div>
