
{% load i18n %}
{% if results %}
  <div class="absolute z-10 w-full mt-1 bg-[var(--color-surface-strong)] rounded-md shadow-lg border border-gray-600 max-h-60 overflow-auto">
    {% for season in results %}
      <button type="button"
              class="w-full px-4 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface)] hover:text-[var(--color-text)]"
              data-parent-picker-option
              data-parent-picker-input="parent-season-input"
              data-parent-picker-hidden="parent-season-id"
              data-parent-picker-results="parent-season-results"
              data-parent-picker-value="{{ season.id }}"
              data-parent-picker-label="{% blocktranslate trimmed with value_1=season.item.title value_2=season.item.season_number context 'parent season input label' %}Season {{ value_2 }} of {{ value_1 }}{% endblocktranslate %}">
        {% blocktranslate trimmed with value_1=season.item.title value_2=season.item.season_number %}{{ value_1 }} - Season {{ value_2 }}{% endblocktranslate %}
      </button>
    {% endfor %}
  </div>
{% elif query %}
  <div class="absolute z-10 w-full mt-1 bg-[var(--color-surface-strong)] rounded-md shadow-lg border border-gray-600 p-3">
    <p class="text-sm text-[var(--color-text-muted)]">{% blocktranslate trimmed with value_1=query %}No seasons found matching "{{ value_1 }}". Please try a different search term.{% endblocktranslate %}</p>
  </div>
{% endif %}
