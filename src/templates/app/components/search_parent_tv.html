
{% load i18n %}
{% if results %}
  <div class="absolute z-10 w-full mt-1 bg-[var(--color-surface-strong)] rounded-md shadow-lg border border-gray-600 max-h-60 overflow-auto">
    {% for tv in results %}
      <button type="button"
              class="w-full px-4 py-2 text-left text-sm text-[var(--color-text-secondary)] hover:bg-[var(--color-surface)] hover:text-[var(--color-text)]"
              data-parent-picker-option
              data-parent-picker-input="parent-tv-input"
              data-parent-picker-hidden="parent-tv-id"
              data-parent-picker-results="parent-tv-results"
              data-parent-picker-value="{{ tv.id }}"
              data-parent-picker-label="{{ tv.item.title }}">
        {{ tv.item.title }}
      </button>
    {% endfor %}
  </div>
{% elif query %}
  <div class="absolute z-10 w-full mt-1 bg-[var(--color-surface-strong)] rounded-md shadow-lg border border-gray-600 p-3">
    <p class="text-sm text-[var(--color-text-muted)]">{% blocktranslate trimmed with value_1=query %}No TV shows found matching "{{ value_1 }}". Please try a different search term.{% endblocktranslate %}</p>
  </div>
{% endif %}
