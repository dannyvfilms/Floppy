
{% load i18n %}
{% load app_tags %}
{% load user_tags %}

<div x-data="{ trackOpen: false, noteExpanded: false }"
     class="border-b border-[var(--color-border)] last:border-b-0">
  <button type="button"
          class="flex w-full items-start gap-3 px-3 py-3 text-left transition-colors hover:bg-[var(--color-surface-muted)] focus:outline-none focus-visible:ring-2 focus-visible:ring-indigo-500"
          aria-label="{% blocktranslate trimmed with value_1=entry.display_title|default:entry.title %}View activity for {{ value_1 }}{% endblocktranslate %}"
          hx-get="{% media_view_url 'track_modal' entry.item %}"
          hx-vals='{"return_url": "{{ request.get_full_path|urlencode }}"{% if entry.instance_id is not None %}, "instance_id": "{{ entry.instance_id }}"{% endif %}, "standard_modal": "1"}'
          hx-target="#session-track-modal-{{ entry.media_type }}-{{ entry.entry_key }}"
          hx-trigger="click"
          @click="trackOpen = true">
    <img src="{{ entry.poster|image_url }}"
         alt=""
         aria-hidden="true"
         class="w-10 shrink-0 rounded object-cover {% if entry.media_type == MediaTypes.MUSIC.value or entry.media_type == MediaTypes.PODCAST.value %}aspect-square{% else %}aspect-[2/3]{% endif %}">

    <span class="min-w-0 flex-1">
      <span class="flex items-start justify-between gap-2">
        <span class="min-w-0 truncate text-sm font-semibold text-[var(--color-text)]">
          {{ entry.display_title|default:entry.title }}
        </span>
        {% if entry.score|show_media_score:user %}
          <span class="flex shrink-0 items-center gap-1 text-xs text-yellow-300">
            {% include "app/icons/star.svg" with classes="w-3 h-3 text-yellow-400 fill-current" %}
            <span class="font-medium">{{ entry.score|score_display:user }}</span>
          </span>
        {% endif %}
      </span>

      <span class="mt-1 block text-xs text-[var(--color-text-muted)]">
        {% if entry.media_type == MediaTypes.MUSIC.value %}
          {% blocktranslate trimmed with value_1=entry.play_count|default:1 count count=entry.play_count|default:1 %}{{ value_1 }} play{% plural %}{{ value_1 }} plays{% endblocktranslate %}{% if entry.time_range_display %} · {{ entry.time_range_display }}{% endif %}
        {% elif entry.episode_label %}
          {{ entry.episode_label }}{% if entry.played_at_local %} · {{ entry.played_at_local|user_datetime_format:user }}{% endif %}
        {% elif entry.played_at_local %}
          {{ entry.played_at_local|user_datetime_format:user }}
        {% else %}
          {% translate "Date not recorded" %}
        {% endif %}
        {% if entry.media_type == MediaTypes.PODCAST.value and entry.progress_display %}
          · {{ entry.progress_display }}{% if entry.runtime_display %} / {{ entry.runtime_display }}{% endif %}
        {% elif entry.runtime_display %}
          · {{ entry.runtime_display }}
        {% endif %}
      </span>

      {% if entry.notes %}
        {% with plain_note=entry.notes|striptags %}
          <span x-show="!noteExpanded"
                class="mt-1 block text-xs leading-5 text-[var(--color-text-secondary)] line-clamp-2">
            {{ plain_note|truncatechars:140 }}
          </span>
          <span x-show="noteExpanded"
                x-cloak
                class="mt-1 block whitespace-pre-wrap text-xs leading-5 text-[var(--color-text-secondary)]">
            {{ plain_note }}
          </span>
          {% if plain_note|length > 140 %}
            <span role="button"
                  tabindex="0"
                  class="mt-1 inline-block text-xs font-medium text-[var(--color-link)] hover:text-[var(--color-link-hover)]"
                  :aria-expanded="noteExpanded.toString()"
                  @click.stop="noteExpanded = !noteExpanded"
                  @keydown.enter.prevent.stop="noteExpanded = !noteExpanded"
                  @keydown.space.prevent.stop="noteExpanded = !noteExpanded">
              <span x-show="!noteExpanded">{% translate "Show more" %}</span>
              <span x-show="noteExpanded">{% translate "Show less" %}</span>
            </span>
          {% endif %}
        {% endwith %}
      {% endif %}
    </span>
  </button>

  <div x-show="trackOpen"
       x-cloak
       data-session-history-track-modal
       @keydown.escape.window="trackOpen = false"
       class="fixed inset-0 z-50 flex items-center justify-center bg-black/50">
    <div class="modal-max-height relative z-60 w-full overflow-y-auto px-4 md:px-0"
         style="width: min(96vw, 72rem);"
         @click.outside="trackOpen = false"
         @click.stop>
      <div id="session-track-modal-{{ entry.media_type }}-{{ entry.entry_key }}"></div>
    </div>
  </div>
</div>
