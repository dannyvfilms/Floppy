
{% load i18n %}
{% if has_tag %}
  <button type="button"
          hx-post="{% url 'tag_item_toggle' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"tag_id": "{{ tag.id }}", "item_id": "{{ item.id }}", "preview_genres_json": "{{ preview_genres_json|default:'[]'|escapejs }}", "preview_implied_genres_json": "{{ preview_implied_genres_json|default:'[]'|escapejs }}"}'
          hx-swap="outerHTML"
          class="inline-flex h-8 items-center justify-center rounded-md px-3 text-sm font-medium text-[var(--color-text)] hover:bg-violet-500/10 transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] cursor-pointer"
          title="{% translate "Remove tag from this item" %}"
          aria-label="{% blocktranslate trimmed with value_1=tag.name %}Remove {{ value_1 }} from this item{% endblocktranslate %}">
    {% translate "Remove" %}
  </button>
{% else %}
  <button type="button"
          hx-post="{% url 'tag_item_toggle' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"tag_id": "{{ tag.id }}", "item_id": "{{ item.id }}", "preview_genres_json": "{{ preview_genres_json|default:'[]'|escapejs }}", "preview_implied_genres_json": "{{ preview_implied_genres_json|default:'[]'|escapejs }}"}'
          hx-swap="outerHTML"
          class="inline-flex h-8 items-center justify-center rounded-md px-3 text-sm font-medium text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-muted)] hover:text-[var(--color-text)] transition-colors focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] cursor-pointer"
          title="{% translate "Add tag to this item" %}"
          aria-label="{% blocktranslate trimmed with value_1=tag.name %}Add {{ value_1 }} to this item{% endblocktranslate %}">
    {% translate "Add" %}
  </button>
{% endif %}
