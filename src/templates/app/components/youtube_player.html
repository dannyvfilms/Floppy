{% load i18n %}<!doctype html>
<html lang="{{ LANGUAGE_CODE|default:'en' }}">
  <head><meta name="referrer" content="strict-origin-when-cross-origin"><title>{% translate "YouTube player" %}</title></head>
  <body style="margin:0;overflow:hidden;background:#000">
    <iframe src="https://www.youtube.com/embed/{{ video_id }}{% if autoplay %}?autoplay=1{% endif %}"
            title="{% translate 'YouTube video player' %}" referrerpolicy="strict-origin-when-cross-origin"
            style="position:absolute;inset:0;width:100%;height:100%;border:0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            allowfullscreen></iframe>
  </body>
</html>
