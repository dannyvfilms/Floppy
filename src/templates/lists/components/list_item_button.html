
{% load i18n %}
{% if has_item %}
  <button type="button"
          hx-post="{% url 'list_item_toggle' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"custom_list_id": "{{ custom_list.id }}", "item_id": "{{ item.id }}"}'
          hx-swap="outerHTML"
          class="inline-flex h-8 items-center justify-center rounded-md px-3 border border-emerald-500/30 transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] bg-emerald-500/10 hover:bg-emerald-500/20 text-[var(--color-text)] text-sm font-medium"
          title="{% blocktranslate trimmed with value_1=custom_list.name %}Remove from {{ value_1 }}{% endblocktranslate %}"
          aria-label="{% blocktranslate trimmed with value_1=custom_list.name %}Remove item from {{ value_1 }}{% endblocktranslate %}">
    {% translate "Remove" %}
  </button>
{% else %}
  <button type="button"
          hx-post="{% url 'list_item_toggle' %}"
          hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
          hx-vals='{"custom_list_id": "{{ custom_list.id }}", "item_id": "{{ item.id }}"}'
          hx-swap="outerHTML"
          class="inline-flex h-8 items-center justify-center rounded-md px-3 transition-colors cursor-pointer focus:outline-none focus:ring-2 focus:ring-[var(--color-accent)] bg-[var(--color-surface-strong)] hover:bg-[var(--color-surface-hover)] text-[var(--color-text)] text-sm font-medium"
          title="{% blocktranslate trimmed with value_1=custom_list.name %}Add to {{ value_1 }}{% endblocktranslate %}"
          aria-label="{% blocktranslate trimmed with value_1=custom_list.name %}Add item to {{ value_1 }}{% endblocktranslate %}">
    {% translate "Add" %}
  </button>
{% endif %}
