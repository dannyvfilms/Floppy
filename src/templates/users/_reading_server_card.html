{% load i18n user_tags %}
{# Import-page card for a reading server. Params: slug, account, blurb (translated). #}
<button type="button"
        @click="openModal('{{ slug }}')"
        x-show="sourceSupports(['reading'])"
        x-transition.opacity.duration.150ms
        class="bg-[var(--color-surface-strong)] hover:bg-[var(--color-surface-border)] transition-colors rounded-lg p-4 text-left cursor-pointer flex flex-col gap-2">
  <div class="flex items-center justify-between">
    {% source_display slug %}
    {% if account and account.is_connected %}<span class="flex items-center justify-center w-5 h-5 rounded-full bg-emerald-500/10 text-[var(--color-success-text)] border border-emerald-500/30" title="{% translate "Connected" %}">{% include "app/icons/checkmark.svg" with classes="w-3 h-3" %}</span>{% endif %}
  </div>
  <p class="text-xs text-[var(--color-text-muted)] line-clamp-2">{{ blurb }}</p>
</button>
