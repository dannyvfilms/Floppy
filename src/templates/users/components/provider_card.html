{% load i18n user_tags %}
<a href="{% url 'provider_detail' provider.slug %}{% if selected_capability %}?tab={{ selected_capability }}{% endif %}"
   aria-label="{% blocktranslate with name=provider.label %}Open {{ name }}{% endblocktranslate %}"
   class="bg-[var(--color-surface-strong)] hover:bg-[var(--color-surface-border)] transition-colors rounded-lg p-4 text-left flex flex-col gap-2">
  <div class="flex items-start justify-between gap-2 min-w-0">
    {% source_display provider.logo_slug|default:provider.slug label=provider.label %}
    {% if provider.state.attention %}
      <span class="shrink-0 text-[var(--color-warning-text)]" title="{% translate provider.state.summary %}">{% include "app/icons/warning.svg" with classes="w-4 h-4" %}</span>
    {% endif %}
  </div>
  <p class="text-xs text-[var(--color-text-muted)] line-clamp-2">{{ provider.description }}</p>
</a>
