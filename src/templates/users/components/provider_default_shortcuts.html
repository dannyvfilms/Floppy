{% load i18n app_tags %}
      {% if provider.settable_media_types %}
        <div class="border-t border-gray-700/60 pt-3 space-y-2">
          <p class="text-sm text-[var(--color-text-muted)]">
            {% translate "Make this the default provider for" %}
          </p>
          {% for media_type in provider.settable_media_types %}
            <form method="post" action="{% url 'set_media_type_provider' media_type %}">
              {% csrf_token %}
          {% if provider_navigation %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% endif %}
              <input type="hidden" name="source" value="{{ provider.slug }}">
              <button type="submit"
                      class="w-full px-4 py-2 text-sm rounded-md transition-colors cursor-pointer bg-[var(--color-surface)] text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-hover)]">
                {% blocktranslate with type=media_type|media_type_readable_plural %}Set as default for {{ type }}{% endblocktranslate %}
              </button>
            </form>
          {% endfor %}
        </div>
      {% endif %}
