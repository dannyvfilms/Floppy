{% load i18n %}
      {# Personal override #}
      {% if provider.user_scope %}
        <div class="ui-personal-credentials {% if not provider_inline %}border-t border-gray-700/60 pt-3{% endif %}">
          <p class="text-sm text-[var(--color-text-muted)]">
            {% translate "Your key may avoid shared instance or bundled rate limits." %}
          </p>
          <form method="post"
                action="{% url 'save_personal_credential' provider.slug %}"
                class="space-y-3">
            {% csrf_token %}
          {% if provider_navigation %}<input type="hidden" name="next" value="{{ request.get_full_path }}">{% endif %}
            {% for field in provider.personal_fields %}
              <div>
                <label class="block text-sm text-[var(--color-text-muted)] mb-2"
                       for="{{ provider.slug }}-personal-{{ field.name }}">{% blocktranslate with value1=field.label %}Your {{ value1 }}{% endblocktranslate %}</label>
                <input id="{{ provider.slug }}-personal-{{ field.name }}"
                       type="{% if field.secret %}password{% else %}text{% endif %}"
                       name="{{ field.name }}"
                       autocomplete="off"
                       placeholder="{% if field.has_personal_value %}{{ field.personal_preview }}{% else %}{{ field.placeholder }}{% endif %}"
                       class="w-full py-2 px-3 bg-[var(--color-surface)] rounded-md text-[var(--color-text)] text-sm border border-gray-600 focus:border-indigo-500 focus:outline-none focus:ring focus:ring-indigo-200 focus:ring-opacity-50">
              </div>
            {% endfor %}
            <button type="submit"
                    class="w-full px-4 py-2 text-sm rounded-md transition-colors cursor-pointer bg-indigo-600 text-white hover:bg-indigo-700">
              {% translate "Save personal key" %}
            </button>
          </form>
        </div>
      {% endif %}
