{% load i18n %}
<div id="provider-results" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3" hx-history="false">
  {% for provider in providers %}
    {% include "users/components/provider_card.html" with selected_capability=capability %}
  {% empty %}
    <p class="col-span-full py-8 text-sm text-center text-[var(--color-text-muted)]">{% translate "No providers match these filters." %}</p>
  {% endfor %}
</div>
