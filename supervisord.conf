[supervisord]
nodaemon=true
user=root

[program:nginx]
command=sh -c 'if [ "${FLOPPY_IPV6_ENABLED:-${YAMTRACK_IPV6_ENABLED:-False}}" = "True" ]; then CONF=/etc/nginx/nginx.ipv6.conf; else CONF=/etc/nginx/nginx.conf; fi; nginx -c $CONF -g "daemon off;"'
user=root
priority=1
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:gunicorn]
command=gunicorn --control-socket /tmp/gunicorn.ctl --config python:config.gunicorn config.wsgi:application
user=abc
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

; The default worker's queue set widens on constrained hosts, absorbing the
; discover (and on minimal hosts the interactive) queue so those workers - each
; a whole resident Django import - don't have to run. entrypoint.sh sets these
; from config/runtime_profile.py; the shell defaults keep this working if
; supervisord is invoked directly.
[program:celery]
command=sh -c 'if [ "${ENV_DEBUG:-False}" = "True" ]; then LOGLEVEL=DEBUG; else LOGLEVEL=INFO; fi; celery --app config worker --beat --scheduler django --queues "${FLOPPY_CELERY_QUEUES:-celery}" --hostname=celery@%%h --loglevel $LOGLEVEL --without-mingle --without-gossip'
environment=FLOPPY_PROCESS_ROLE="%(ENV_FLOPPY_CELERY_ROLE)s"
user=abc
stopasgroup=true
stopwaitsecs=60
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

[program:celery-interactive]
command=sh -c 'if [ "${ENV_DEBUG:-False}" = "True" ]; then LOGLEVEL=DEBUG; else LOGLEVEL=INFO; fi; celery --app config worker --queues interactive --hostname=celery-interactive@%%h --loglevel $LOGLEVEL --without-mingle --without-gossip'
environment=FLOPPY_PROCESS_ROLE="interactive"
autostart=%(ENV_FLOPPY_START_INTERACTIVE_WORKER)s
user=abc
stopasgroup=true
stopwaitsecs=60
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0

[program:celery-discover]
command=sh -c 'if [ "${ENV_DEBUG:-False}" = "True" ]; then LOGLEVEL=DEBUG; else LOGLEVEL=INFO; fi; celery --app config worker --queues discover --hostname=celery-discover@%%h --loglevel $LOGLEVEL --without-mingle --without-gossip'
environment=FLOPPY_PROCESS_ROLE="background"
autostart=%(ENV_FLOPPY_START_DISCOVER_WORKER)s
user=abc
stopasgroup=true
stopwaitsecs=60
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stdout
stderr_logfile_maxbytes=0
